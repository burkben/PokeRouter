# XcodeGen spec. Generate the Xcode project with:
#   cd ios && xcodegen generate
# Then open PokeRouter.xcodeproj. The .xcodeproj is git-ignored on purpose —
# project.yml is the source of truth.
name: PokeRouter
options:
  bundleIdPrefix: com.pokerouter
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
    # Set your Apple Developer team here (or in Xcode) to run on a device.
    DEVELOPMENT_TEAM: ""
targets:
  PokeRouter:
    type: application
    platform: iOS
    sources:
      - path: PokeRouter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pokerouter.app
        INFOPLIST_FILE: PokeRouter/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: PokeRouter/Resources/PokeRouter.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  PokeRouterTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/PokeRouterTests
    dependencies:
      - target: PokeRouter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pokerouter.app.tests
        GENERATE_INFOPLIST_FILE: "YES"
schemes:
  PokeRouter:
    build:
      targets:
        PokeRouter: all
        PokeRouterTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PokeRouterTests
